</style>
<div id="cs2-report-mockups" aria-label="Quick review with Leetify and team groups">
  <div class="cs2" id="cs2-quick" aria-label="Quick review report"></div>
</div>
<script>
(() => {
  const root = document.getElementById('cs2-report-mockups');
  const el = root.querySelector('#cs2-quick');
  const providers = ['Leetify','CSStats','FACEIT','Steam'];
  const people = [
    {name:'vanta',team:'opponents',rating:8.64,aim:95,utility:48,positioning:72,ttd:384,preaim:5.2,accuracy:46,strafing:94,kd:2.12,n:32,premier:18420,total:286,fkd:1.93,hs:74,win:64,matches:118,level:8,elo:1724,hours:386},
    {name:'sable',team:'opponents',rating:4.28,aim:82,utility:61,positioning:69,ttd:462,preaim:7.1,accuracy:39,strafing:91,kd:1.64,n:24,premier:21060,total:694,fkd:1.91,hs:62,win:59,matches:240,level:9,elo:1952,hours:1620},
    {name:'north',team:'opponents',rating:2.16,aim:67,utility:55,positioning:64,ttd:512,preaim:8.4,accuracy:35,strafing:89,kd:1.21,n:30,premier:19240,total:1432,fkd:1.16,hs:52,win:54,matches:864,level:8,elo:1792,hours:3240},
    {name:'kiln',team:'opponents',rating:0.82,aim:58,utility:62,positioning:56,ttd:566,preaim:10.1,accuracy:32,strafing:87,kd:1.08,n:30,premier:17890,total:874,fkd:1.10,hs:49,win:51,matches:412,level:7,elo:1628,hours:2140},
    {name:'moss',team:'opponents',rating:-1.24,aim:46,utility:41,positioning:50,ttd:624,preaim:12.4,accuracy:29,strafing:82,kd:0.94,n:28,premier:16410,total:436,fkd:0.98,hs:43,win:49,matches:276,level:6,elo:1438,hours:1480},
    {name:'you',team:'yours',self:true,rating:1.78,aim:64,utility:59,positioning:61,ttd:534,preaim:9.2,accuracy:34,strafing:88,kd:1.14,n:30,premier:18620,total:1158,fkd:1.09,hs:48,win:53,matches:624,level:7,elo:1662,hours:2680},
    {name:'orbit',team:'yours',rating:0.64,aim:57,utility:53,positioning:58,ttd:561,preaim:10.4,accuracy:32,strafing:87,kd:1.07,n:30,premier:18110,total:732,fkd:1.04,hs:56,win:52,matches:390,level:7,elo:1584,hours:1940},
    {name:'cedar',team:'yours',rating:-0.48,aim:51,utility:48,positioning:54,ttd:594,preaim:11.8,accuracy:30,strafing:84,kd:0.98,n:30,premier:17340,total:350,fkd:1.02,hs:46,win:50,matches:187,level:6,elo:1480,hours:1120},
    {name:'hush',team:'yours',rating:0.32,aim:54,utility:46,positioning:55,ttd:578,preaim:10.9,accuracy:31,strafing:86,kd:1.02,n:24,premier:16980,total:260,fkd:null,hs:null,win:null,matches:null,level:null,elo:null,hours:null,privateHours:true},
    {name:'cloudless',team:'yours',rating:null,aim:null,utility:null,positioning:null,ttd:null,preaim:null,accuracy:null,strafing:null,kd:null,n:null,premier:null,total:null,fkd:null,hs:null,win:null,matches:null,level:null,elo:null,hours:null}
  ];
  const saved = window.openai?.widgetState?.privateContent;
  const s = {selected:0,provider:'Leetify',manual:false,addOpen:false,feedback:'',loading:false,closed:false,updated:false,empty:false,dataDetails:false,density:'Comfortable',teams:'Teams known (sample)'};
  function restore(data){
    if(!data||data.version!==2)return;
    if(Number.isInteger(data.selected)&&data.selected>=0&&data.selected<people.length)s.selected=data.selected;
    if(providers.includes(data.provider))s.provider=data.provider;
    if(['Teams known (sample)','Teams unavailable','Free-for-all'].includes(data.teams))s.teams=data.teams;
  }
  restore(saved);
  let timer;
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const fmt = (v,d=0) => v==null?'Unavailable':v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
  const signed = v => v==null?'Unavailable':`${v>0?'+':''}${fmt(v,2)}`;
  const flag = p => p.kd!=null&&p.n>=20&&p.kd>=2;
  const groupName = p => s.teams==='Free-for-all'?'Free-for-all':s.teams==='Teams unavailable'?'Team unknown':p.team==='yours'?'Your team':'Opponents';
  const status = p => flag(p)?'Review recent K/D':p.n==null?'Insufficient data':'No rule triggered';
  const chrome = () => `<div class="steam-chrome"><div class="steam-game"><span class="game-logo">CS2</span><span>COUNTER-STRIKE 2</span><span class="sample">Sample data</span></div><div class="steam-right">Steam overlay · Shift + Tab</div></div>`;
  const dock = () => `<div class="dock" aria-label="Steam overlay context"><span class="dock-item">${icon('layout-grid')} Overview</span><span class="dock-item">${icon('users')} Friends</span><span class="dock-item">${icon('notebook-pen')} Notes</span><span class="dock-item chosen">${icon('scan-line')} Players</span></div>`;
  const sourceLink = (name,url) => `<a class="profile-link" href="${url}" target="_blank" rel="noreferrer">View on ${name} ${icon('arrow-up-right')}</a>`;
  const fact = (name,value) => `<div><dt>${name}</dt><dd>${value}</dd></div>`;
  function who(p){return `<span class="who"><span class="avatar">${p.name[0].toUpperCase()}</span><span class="who-text"><span class="player-name">${p.self?'You':p.name}</span>${flag(p)?`<span class="player-state warn">${icon('triangle-alert')}High K/D</span>`:''}</span></span>`;}
  function row(p){const i=people.indexOf(p);return `<button class="roster-line cursor-interaction ${s.selected===i?'selected':''}" data-player="${i}" aria-label="Inspect ${p.name}" aria-pressed="${s.selected===i}">${who(p)}<span class="metric-cell number">${p.rating==null?'N/A':signed(p.rating)}</span><span class="metric-cell number">${p.aim==null?'N/A':fmt(p.aim)}</span><span class="metric-cell number" data-metric="ttd">${p.ttd==null?'N/A':fmt(p.ttd)+' ms'}</span><span class="metric-cell number ${flag(p)?'hot':''}">${p.kd==null?'N/A':fmt(p.kd,2)}${p.n==null?'':`<small>${p.n} games</small>`}</span></button>`;}
  function team(title,players){return `<section class="team-group" aria-label="${title}"><div class="team-heading"><h3>${title} <span class="muted">· ${players.length}</span></h3></div><div class="roster-line header"><span>PLAYER</span><span class="metric-cell">Leetify Rating</span><span class="metric-cell">Aim</span><span class="metric-cell" data-tooltip="Time from seeing an enemy to first damage, not pure reaction time.">Time to Damage</span><span class="metric-cell">Recent K/D</span></div>${players.map(row).join('')}</section>`;}
  function roster(){
    let groups;
    if(s.teams==='Teams unavailable')groups=team('Team unknown',people);
    else if(s.teams==='Free-for-all')groups=team('Free-for-all',people);
    else groups=team('Opponents',people.filter(p=>p.team==='opponents'))+team('Your team',people.filter(p=>p.team==='yours'));
    return `<div class="roster-head"><strong>Leetify</strong><span>1 flagged</span></div>${groups}${s.manual?`<section class="team-group manual-group" aria-label="Team unknown, manually added"><div class="team-heading"><h3>Team unknown · 1</h3><span class="team-note">Manually added</span></div><div class="roster-line"><span><span class="player-name">Added profile</span></span><span class="metric-cell">N/A</span><span class="metric-cell">N/A</span><span class="metric-cell" data-metric="ttd">N/A</span><span class="metric-cell">N/A</span></div></section>`:''}`;
  }
  function leetify(p){
    if(p.rating==null)return `<div class="provider-empty"><h3>Leetify data unavailable</h3>${sourceLink('Leetify','https://leetify.com/')}</div>`;
    return `<dl class="facts">${fact('Leetify Rating',signed(p.rating))}${fact('Aim',fmt(p.aim))}${fact('Utility',fmt(p.utility))}${fact('Positioning',fmt(p.positioning))}${fact('Time to Damage',fmt(p.ttd)+' ms')}${fact('Crosshair placement',fmt(p.preaim,1)+'°')}${fact('Accuracy (Enemy Spotted)',fmt(p.accuracy)+'%')}${fact('Proper Counter-Strafing',fmt(p.strafing)+'%')}${fact('Premier rating',fmt(p.premier))}${fact('Recent K/D',fmt(p.kd,2)+` <span class="minor">· ${p.n} matches</span>`)}</dl>${flag(p)?`<div class="review-note"><div class="review-title">${icon('triangle-alert')}High K/D</div><p class="minor">Plugin rule: ≥ 2.00 K/D · min. 20 matches</p></div>`:''}<div class="data-actions">${sourceLink('Leetify','https://leetify.com/')}<button class="data-toggle cursor-interaction" data-action="data-details" aria-expanded="${s.dataDetails}" aria-controls="data-notes">Data details</button></div><div class="data-notes" id="data-notes" ${s.dataDetails?'':'hidden'}><p>${status(p)}.</p><p>Recent K/D is derived from Leetify match records. The threshold is plugin-defined.</p><p>Profile window: unavailable. Leetify benchmarks: unavailable.</p><p>Preview links open provider sites.</p></div>`;
  }
  function providerBody(p){
    if(s.provider==='Leetify')return leetify(p);
    if(s.provider==='CSStats')return `<div class="provider-empty">${sourceLink('CSStats','https://csstats.gg/')}</div>`;
    if(s.provider==='FACEIT')return p.level==null?`<div class="provider-empty"><h3>FACEIT data unavailable</h3>${sourceLink('FACEIT','https://www.faceit.com/')}</div>`:`<div class="source-context">Lifetime · ${p.matches} matches</div><dl class="facts">${fact('Level',fmt(p.level))}${fact('ELO',fmt(p.elo))}${fact('K/D',fmt(p.fkd,2))}${fact('Headshots',fmt(p.hs)+'%')}${fact('Win rate',fmt(p.win)+'%')}</dl>${sourceLink('FACEIT','https://www.faceit.com/')}`;
    return `<dl class="facts">${fact('CS2 playtime',p.hours==null?'Unavailable':fmt(p.hours)+' h')}${fact('Game details',p.privateHours?'Private':p.hours==null?'Unavailable':'Public')}${fact('Roster source','Steam current players')}${fact('Team',groupName(p))}</dl>${sourceLink('Steam','https://steamcommunity.com/')}`;
  }
  function inspector(){const p=people[s.selected];return `<div class="who"><span class="avatar">${p.name[0].toUpperCase()}</span><div><h2>${p.self?'You':p.name}</h2></div></div><div class="external-links" aria-label="More player lookup sites"><a href="https://csrep.gg/" target="_blank" rel="noreferrer" aria-label="Open CSRep website">CSRep ${icon('arrow-up-right')}</a><a href="https://cstracker.gg/" target="_blank" rel="noreferrer" aria-label="Open CSTracker website">CSTracker ${icon('arrow-up-right')}</a></div><div class="provider-tabs" role="tablist" aria-label="Statistics provider">${providers.map(name=>`<button class="provider-tab cursor-interaction" id="tab-${name}" role="tab" aria-controls="provider-panel" aria-selected="${s.provider===name}" data-provider="${name}">${name}</button>`).join('')}</div><div id="provider-panel" role="tabpanel" aria-live="polite" aria-labelledby="tab-${s.provider}">${providerBody(p)}</div>`;}
  function manualForm(){return `<form class="manual" ${s.addOpen?'':'hidden'}><label for="cs2-profile-input">Add a Steam profile link or SteamID64</label><input id="cs2-profile-input" data-profiles placeholder="https://steamcommunity.com/profiles/…"><div class="action-row"><button type="button" data-action="submit-profile" class="action primary cursor-interaction">Add to report</button><button type="button" class="action cursor-interaction" data-action="cancel-add">Cancel</button></div><p class="feedback" role="status">${s.feedback}</p></form>`;}
  function render(){
    el.classList.toggle('density-compact',s.density==='Compact');
    if(s.closed)el.innerHTML=chrome()+`<div class="empty"><h2>Player report</h2><button class="action primary cursor-interaction" data-action="reopen">${icon('scan-line')} Scan players</button></div>`+dock();
    else el.innerHTML=chrome()+`<div class="report"><header class="titlebar"><div><h1>Player report</h1><div class="subtitle">${s.loading?'Refreshing…':s.updated?'Just updated':'21:47'} · Historical stats</div></div><div class="action-row"><button class="action cursor-interaction" data-action="add">${icon('plus')} Add profiles</button><button class="action primary cursor-interaction" data-action="refresh">${icon('refresh-cw')} Refresh report</button><button class="icon-action cursor-interaction" data-action="close" aria-label="Close report">${icon('x')}</button></div></header><div class="coverage">${icon('info')}<span><strong>${s.empty?0:10} detected by Steam</strong> · ${s.manual?'1 added manually · ':''}Coverage unverified</span></div>${manualForm()}${s.loading?`<div class="progress-line" role="status"><span>Refreshing public sources…</span><button class="action cursor-interaction" data-action="cancel">Cancel</button></div>`:''}${s.empty?`<div class="empty"><h2>No roster available</h2><p>Retry or add profiles.</p><button class="action primary cursor-interaction" data-action="refresh">Retry scan</button></div>`:`<div class="split"><div class="roster-list">${roster()}</div><aside class="inspector" aria-label="Selected player profile">${inspector()}</aside></div>`}<footer class="report-footer"><span>Flags are not proof of cheating.</span><a class="provided" href="https://leetify.com/" target="_blank" rel="noreferrer">Data provided by <b>Leetify</b></a></footer></div>`+dock();
    if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}});
  }
  function persist(){window.openai?.setWidgetState?.({modelContent:{design:'Quick review',primaryProvider:'Leetify',selectedSamplePlayer:people[s.selected].name,providerTab:s.provider,teamDisplay:s.teams},privateContent:{version:2,selected:s.selected,provider:s.provider,teams:s.teams}})?.catch(()=>{});}
  function selectProvider(name,focus=false){s.provider=name;s.dataDetails=false;render();if(focus)el.querySelector(`[data-provider="${name}"]`)?.focus();persist();}
  function submitManual(){
    const value=el.querySelector('[data-profiles]')?.value.trim()||'';
    if(!/^(https:\/\/steamcommunity\.com\/(profiles\/\d{17}|id\/[\w-]+)\/?|\d{17})$/.test(value)){s.feedback='Enter a Steam profile link or SteamID64.';render();return;}
    s.manual=true;s.empty=false;s.feedback='Sample profile added.';render();persist();
  }
  el.addEventListener('submit',e=>{e.preventDefault();submitManual();});
  el.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!el.contains(b))return;
    if(b.dataset.player!==undefined){s.selected=Number(b.dataset.player);s.dataDetails=false;render();el.querySelector(`[data-player="${s.selected}"]`)?.focus();persist();return;}
    if(b.dataset.provider){selectProvider(b.dataset.provider,true);return;}
    const a=b.dataset.action;if(!a)return;
    if(a==='submit-profile'){submitManual();return;}
    if(a==='data-details'){s.dataDetails=!s.dataDetails;render();el.querySelector('[data-action="data-details"]')?.focus();return;}
    if(a==='add'){s.addOpen=!s.addOpen;s.feedback='';render();if(s.addOpen)el.querySelector('[data-profiles]')?.focus();}
    if(a==='cancel-add'){s.addOpen=false;render();el.querySelector('[data-action="add"]')?.focus();}
    if(a==='refresh'){clearTimeout(timer);s.provider='Leetify';s.loading=true;s.manual=false;s.empty=false;s.feedback='';render();timer=setTimeout(()=>{s.loading=false;s.updated=true;render();},800);}
    if(a==='cancel'){clearTimeout(timer);s.loading=false;render();}
    if(a==='close'){clearTimeout(timer);s.closed=true;s.loading=false;s.manual=false;s.addOpen=false;render();el.querySelector('[data-action="reopen"]')?.focus();}
    if(a==='reopen'){s.closed=false;s.selected=0;s.provider='Leetify';render();}
    persist();
  });
  el.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('[data-profiles]')){e.preventDefault();submitManual();return;}
    if(e.key==='Escape'&&!s.closed){clearTimeout(timer);s.closed=true;s.loading=false;s.manual=false;s.addOpen=false;render();el.querySelector('[data-action="reopen"]')?.focus();}
    const b=e.target.closest('[role="tab"]');
    if(b&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
      e.preventDefault();const i=providers.indexOf(b.dataset.provider);
      selectProvider(providers[e.key==='Home'?0:e.key==='End'?3:(i+(e.key==='ArrowRight'?1:3))%4],true);
    }
  });
  window.addEventListener('openai:set_globals',e=>{
    const data=e.detail?.globals?.widgetState?.privateContent;
    if(data){const previous=JSON.stringify([s.selected,s.provider,s.teams]);restore(data);if(previous!==JSON.stringify([s.selected,s.provider,s.teams]))render();}
  });
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:el,onChange:()=>{render();persist();}});tweak.addSelect(s,'teams',{label:'Team data',options:['Teams known (sample)','Teams unavailable','Free-for-all']});tweak.addSelect(s,'density',{label:'Row density',options:['Comfortable','Compact']});tweak.addToggle(s,'empty',{label:'Roster unavailable'});}
})();
</script>
