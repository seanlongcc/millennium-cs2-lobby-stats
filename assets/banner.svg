    <circle cx="76" cy="76" r="5" fill="#8cd7ff" stroke="none"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="276" y="130" fill="#f2f5f7" font-size="54" font-weight="700" letter-spacing="1">CS2 LOBBY STATS</text>
    <text x="279" y="177" fill="#8fa7b8" font-size="23">Leetify, FACEIT and Steam stats — in your overlay.</text>
    <text x="279" y="224" fill="#66c0f4" font-size="18" font-weight="600" letter-spacing="2">FOR MILLENNIUM</text>
  </g>
  <g transform="translate(970 74)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect width="226" height="172" rx="14" fill="#0a1219" stroke="#66c0f4" stroke-opacity="0.22"/>
    <text x="24" y="38" fill="#718a9b" font-size="12" font-weight="700" letter-spacing="1.4">PLAYER SNAPSHOT</text>
    <text x="24" y="78" fill="#718a9b" font-size="11">PREMIER</text>
    <text x="118" y="78" fill="#718a9b" font-size="11">FACEIT</text>
    <text x="24" y="108" fill="#e584bf" font-size="25" font-weight="700">23 109</text>
    <text x="118" y="108" fill="#ee666b" font-size="25" font-weight="700">LVL 10</text>
    <path d="M24 126h178" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="151" fill="#79c9ef" font-size="12" font-weight="700">AIM 90.7</text>
    <text x="118" y="151" fill="#7cc17e" font-size="12" font-weight="700">WR 58.6%</text>
