<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">CS2 Lobby Stats for Millennium</title>
  <desc id="description">A dark blue banner with a crosshair emblem and example CS2 metrics.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b141c"/>
      <stop offset="0.55" stop-color="#122433"/>
      <stop offset="1" stop-color="#081018"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#66c0f4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#66c0f4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66c0f4"/>
      <stop offset="1" stop-color="#8cd7ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#background)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>
  <path d="M0 272 C210 218 330 340 550 272 S900 210 1280 282 V320 H0Z" fill="#66c0f4" opacity="0.04"/>
