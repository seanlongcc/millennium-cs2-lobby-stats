name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: pnpm typecheck && pnpm typecheck:tests && pnpm check:lua
      - run: pnpm build
      - run: pnpm test
      - run: lua5.4 tests/lua/run.lua
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec vitest run tests/package.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: cs2-player-tracker
          path: dist/cs2-player-tracker-v0.1.0.zip
